<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with dark emerald gradient -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Outer Hexagonal shield contour -->
  <path d="M256 42 L440 148 L440 364 L256 470 L72 364 L72 148 Z" fill="#031614" stroke="#10b981" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Inner road contour -->
  <path d="M256 86 L400 172 L400 340 L256 426 L112 340 L112 172 Z" stroke="#065f46" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Geometric N monogram -->
  <path d="M168 360 V152 H214 L298 288 V152 H344 V360 H298 L214 224 V360 H168 Z" fill="url(#nGrad)"/>
  
  <!-- Glowing Ceylon Golden Core / Sun -->
  <g transform="translate(256, 150)">
    <circle cx="0" cy="0" r="24" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="36" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6 6" opacity="0.85"/>
    <line x1="0" y1="-46" x2="0" y2="-34" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="34" x2="0" y2="46" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line x1="-46" y1="0" x2="-34" y2="0" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line x1="34" y1="0" x2="46" y2="0" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
